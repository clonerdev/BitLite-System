  <text x="815" y="110" font-family="IBM Plex Mono, monospace" font-size="11" fill="#38BDF8">btc.viabtc.io:3333 • ltc.viabtc.io</text>
  <text x="815" y="126" font-family="IBM Plex Mono, monospace" font-size="10" fill="#34D399">● Connected (Simultaneous #1)</text>

  <rect x="798" y="150" width="272" height="68" rx="10" fill="#141B2D" stroke="#10B981" stroke-width="1.5" />
  <text x="815" y="174" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399">F2Pool / AntPool (30%)</text>
  <text x="815" y="192" font-family="IBM Plex Mono, monospace" font-size="11" fill="#38BDF8">btc.f2pool.com:1314</text>
  <text x="815" y="208" font-family="IBM Plex Mono, monospace" font-size="10" fill="#34D399">● Connected (Simultaneous #2)</text>

  <rect x="798" y="232" width="272" height="68" rx="10" fill="#141B2D" stroke="#6366F1" stroke-width="1.5" />
  <text x="815" y="256" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Binance / Foundry / Spider (15%)</text>
  <text x="815" y="274" font-family="IBM Plex Mono, monospace" font-size="11" fill="#38BDF8">sha256.poolbinance.com:8888</text>
  <text x="815" y="290" font-family="IBM Plex Mono, monospace" font-size="10" fill="#34D399">● Connected (Simultaneous #3)</text>

  <rect x="798" y="314" width="272" height="68" rx="10" fill="#141B2D" stroke="#38BDF8" stroke-width="1.5" />
  <text x="815" y="338" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">Manual Custom Pool / Self-Node</text>
  <text x="815" y="356" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E2E8F0">custom.pool.host:Port (TCP/SSL)</text>
  <text x="815" y="372" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">● Saved in data/custom-pools.json</text>
</svg>
