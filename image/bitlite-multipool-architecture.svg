<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#13192B" />
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444" />
    </marker>
  </defs>

  <rect width="1100" height="420" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="2" />

  <text x="550" y="38" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    BitLite System — Device-Level Access Guard &amp; Simultaneous Multi-Pool Routing Architecture
  </text>

  <!-- Column 1: Incoming ASIC Miners -->
  <rect x="30" y="72" width="245" height="90" rx="10" fill="#141B2D" stroke="#10B981" stroke-width="1.5" />
  <text x="48" y="98" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399">Authorized ASIC Miner #1</text>
  <text x="48" y="118" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E2E8F0">wallet1.worker1.device101</text>
  <text x="48" y="142" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">235.19 TH/s • Quota: 1/2 Active</text>

  <rect x="30" y="178" width="245" height="90" rx="10" fill="#141B2D" stroke="#10B981" stroke-width="1.5" />
  <text x="48" y="204" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399">Authorized Farm Rack</text>
  <text x="48" y="224" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E2E8F0">farm_north.rack04.s21pro</text>
  <text x="48" y="248" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">315.40 TH/s • Customer Paid Tier</text>

  <rect x="30" y="284" width="245" height="90" rx="10" fill="#1F121B" stroke="#EF4444" stroke-width="1.5" />
  <text x="48" y="310" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#F87171">Unknown / Blocked Miner</text>
  <text x="48" y="330" font-family="IBM Plex Mono, monospace" font-size="11" fill="#FCA5A5">rogue_wallet.rig9.unauthorized</text>
  <text x="48" y="354" font-family="IBM Plex Mono, monospace" font-size="10" fill="#EF4444">⛔ Dropped by Access Guard</text>

  <!-- Arrows from Miners to BitLite Core -->
  <line x1="275" y1="117" x2="365" y2="165" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="275" y1="223" x2="365" y2="215" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="275" y1="329" x2="365" y2="275" stroke="#EF4444" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowRed)" />

  <!-- Column 2: BitLite System Gateway -->
  <rect x="375" y="76" width="320" height="298" rx="14" fill="#161E33" stroke="#6366F1" stroke-width="2" />
  <rect x="395" y="94" width="280" height="32" rx="8" fill="#6366F1" />
  <text x="535" y="115" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">BitLite System Stratum Gateway</text>

  <rect x="395" y="138" width="280" height="64" rx="8" fill="#0F1422" stroke="#334155" />
  <text x="410" y="158" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">1. Device-Level Access Guard</text>
  <text x="410" y="176" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">• Verifies Wallet.Worker.Device</text>
  <text x="410" y="192" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">• Enforces Per-Customer Connection Quota</text>

  <rect x="395" y="212" width="280" height="64" rx="8" fill="#0F1422" stroke="#334155" />
  <text x="410" y="232" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">2. Simultaneous Multi-Pool Router</text>
  <text x="410" y="250" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">• Load Balance % / Simultaneous / Failover</text>
  <text x="410" y="266" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">• TCP / SSL / BLC Encrypted Tunnel</text>

  <rect x="395" y="286" width="280" height="64" rx="8" fill="#0F1422" stroke="#334155" />
  <text x="410" y="306" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#34D399">3. Hot-Update Custom Fee Engine</text>
  <text x="410" y="324" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">• Zero-Downtime DevFee Adjustment</text>
  <text x="410" y="340" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94A3B8">• Persistent Store: data/*.json</text>

  <!-- Arrows from BitLite Core to Upstream Pools -->
  <line x1="695" y1="155" x2="788" y2="105" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <line x1="695" y1="205" x2="788" y2="185" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <line x1="695" y1="245" x2="788" y2="268" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="695" y1="285" x2="788" y2="348" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowAmber)" />

  <!-- Column 3: Simultaneous Upstream Mining Pools -->
  <rect x="798" y="68" width="272" height="68" rx="10" fill="#141B2D" stroke="#F59E0B" stroke-width="1.5" />
